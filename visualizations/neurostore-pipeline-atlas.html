<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>

<style>
/* Layout: full-height app; pan/zoom SVG canvas on the left, detail panel on the right (stacks under the canvas on phones). */
:root{
  --bg:#eef1f4; --surface:#ffffff; --surface-2:#e4e9ee; --ink:#15202b; --ink-2:#4b5866; --ink-3:#7b8794; --line:#c3ccd5;
  --sel:#1f47c4; --plan:#b45309; --spec:#6b7280; --ok:#2f7d32;
  --c-ext:#7a6e62; --c-ing:#0d8578; --c-pondie:#7b4bc4; --c-store:#2a68c9; --c-compose:#b0367e; --c-runner:#8b5e34; --c-nimare:#c0392b; --c-autonima:#3e8a2e; --c-contract:#56657a; --c-user:#3b4a5a;
  --f-diagram:"IBM Plex Sans Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f151b; --surface:#17202a; --surface-2:#1f2a35; --ink:#e4eaf0; --ink-2:#a7b3bf; --ink-3:#74818e; --line:#33414e;
  --sel:#7fa4ff; --plan:#f5a524; --spec:#9aa4b2; --ok:#7cc67f;
  --c-ext:#b2a596; --c-ing:#36bfae; --c-pondie:#a88bef; --c-store:#6aa3f5; --c-compose:#e27ab8; --c-runner:#c9975f; --c-nimare:#f0786a; --c-autonima:#7fcb69; --c-contract:#9eacbd; --c-user:#b8c4d0;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f151b; --surface:#17202a; --surface-2:#1f2a35; --ink:#e4eaf0; --ink-2:#a7b3bf; --ink-3:#74818e; --line:#33414e;
  --sel:#7fa4ff; --plan:#f5a524; --spec:#9aa4b2; --ok:#7cc67f;
  --c-ext:#b2a596; --c-ing:#36bfae; --c-pondie:#a88bef; --c-store:#6aa3f5; --c-compose:#e27ab8; --c-runner:#c9975f; --c-nimare:#f0786a; --c-autonima:#7fcb69; --c-contract:#9eacbd; --c-user:#b8c4d0;
  color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45}
.app{height:100%;display:flex;flex-direction:column}
header{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line);background:var(--surface)}
header h1{font-family:var(--f-diagram);font-weight:700;font-size:19px;letter-spacing:.01em;margin:0;text-wrap:balance}
header h1 small{font-weight:400;color:var(--ink-3);font-size:13px;margin-left:6px}
.tabs{display:flex;gap:2px;background:var(--surface-2);border-radius:8px;padding:3px}
.tabs button,.btn{font:500 13px var(--f-body);border:0;background:transparent;color:var(--ink-2);padding:6px 12px;border-radius:6px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgb(0 0 0 / .12)}
.btn{border:1px solid var(--line);background:var(--surface)}
.btn:hover,.tabs button:hover{color:var(--ink)}
button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--sel);outline-offset:2px}
.legend{display:flex;flex-wrap:wrap;gap:6px;margin-left:auto}
.legend button{display:flex;align-items:center;gap:6px;font:500 12px var(--f-body);color:var(--ink-2);background:transparent;border:1px solid var(--line);border-radius:999px;padding:3px 10px 3px 8px;cursor:pointer}
.legend button[aria-pressed="false"]{opacity:.45;text-decoration:line-through}
.legend svg{width:26px;height:8px}
main{flex:1;display:flex;min-height:0}
.canvas{position:relative;flex:1;min-width:0;background:var(--bg);overflow:hidden;touch-action:none}
.canvas svg{width:100%;height:100%;display:block;cursor:grab;user-select:none}
.canvas svg.dragging{cursor:grabbing}
.zoomctl{position:absolute;right:12px;bottom:12px;display:flex;flex-direction:column;gap:4px}
.zoomctl button{width:34px;height:34px;font:600 16px var(--f-body);border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;cursor:pointer}
.hint{position:absolute;left:12px;bottom:12px;font-size:12px;color:var(--ink-3);background:color-mix(in srgb,var(--surface) 85%,transparent);padding:4px 8px;border-radius:6px;pointer-events:none}
aside{width:380px;flex:none;border-left:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;min-height:0}
aside .tabs{margin:10px 14px 0}
.panel{overflow:auto;padding:14px 18px 28px;flex:1;min-height:0}
.panel h2{font-family:var(--f-diagram);font-size:20px;font-weight:700;margin:2px 0 6px;text-wrap:balance}
.panel h3{font:600 11px var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin:16px 0 6px}
.panel p{margin:0 0 8px;max-width:65ch}
.panel ul{margin:0 0 8px;padding-left:18px}
.panel li{margin:2px 0}
.ref{font-family:var(--f-mono);font-size:12px;color:var(--ink-2);word-break:break-all}
.pill{display:inline-block;font:600 11px var(--f-body);letter-spacing:.03em;padding:2px 8px;border-radius:999px;border:1px solid currentColor}
.pill.impl{color:var(--ok)} .pill.plan{color:var(--plan)} .pill.spec{color:var(--spec)}
.meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:8px;color:var(--ink-2);font-size:12px}
.swatch{width:10px;height:10px;border-radius:3px;display:inline-block}
.steps{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:6px}
.steps button{width:100%;text-align:left;display:grid;grid-template-columns:28px 1fr;gap:8px;align-items:start;font:13px var(--f-body);color:var(--ink);background:var(--surface-2);border:1px solid transparent;border-radius:8px;padding:8px 10px;cursor:pointer}
.steps button[aria-current="true"]{border-color:var(--sel);background:color-mix(in srgb,var(--sel) 10%,var(--surface))}
.steps .n{font:700 13px var(--f-diagram);color:var(--ink-3);font-variant-numeric:tabular-nums}
.steps b{font-weight:600}
.steps span.d{display:block;color:var(--ink-2);font-size:12px;margin-top:2px}
.track{display:flex;gap:6px;margin:4px 0 10px}
.gap{border-left:3px solid var(--plan);padding:4px 0 4px 10px;margin:0 0 12px}
.gap.spec{border-color:var(--spec)} .gap.ok{border-color:var(--ok)}
.gap b{display:block}
.rels{list-style:none;padding:0}
.rels li{margin:3px 0}
.linkbtn{background:none;border:0;padding:0;color:var(--sel);font:inherit;cursor:pointer;text-decoration:underline;text-underline-offset:2px}
table.f{border-collapse:collapse;width:100%;font-size:12.5px}
table.f td{border-top:1px solid var(--line);padding:4px 6px 4px 0;vertical-align:top}
table.f td:first-child{font-family:var(--f-mono);font-size:12px;white-space:nowrap;color:var(--ink)}
table.f td:last-child{color:var(--ink-2)}
.repos{font-size:12.5px} .repos td{padding:2px 8px 2px 0;border-top:1px solid var(--line)}
/* SVG */
.box rect.frame{fill:var(--surface);stroke-width:1.6}
.box .title{font:700 22px var(--f-diagram);fill:var(--ink)}
.box .bsub{font:400 13px var(--f-body);fill:var(--ink-2)}
.box .head{opacity:.12}
.chip rect{stroke-width:1.2}
.chip .lab{font:600 14px var(--f-diagram);fill:var(--ink)}
.chip .sub{font:400 10.5px var(--f-body);fill:var(--ink-2)}
.chip.plan rect,.chip.spec rect{stroke-dasharray:5 3}
.chip:hover rect,.box:hover rect.frame{stroke-width:2.4}
.node{cursor:pointer}
.edge path.line{fill:none;stroke-width:1.8}
.edge.impl path.line{stroke:var(--ink-2)}
.edge.plan path.line{stroke:var(--plan);stroke-dasharray:8 5}
.edge.spec path.line{stroke:var(--spec);stroke-dasharray:2 4}
.edge.map path.line{stroke:var(--sel);stroke-dasharray:6 3;stroke-width:1.5}
.edge.rel path.line{stroke:var(--ink-3);stroke-width:1.1}
.edge path.hit{fill:none;stroke:transparent;stroke-width:14;cursor:pointer}
.elab rect{fill:var(--surface);stroke:var(--line)}
.elab text{font:500 11.5px var(--f-body);fill:var(--ink-2)}
.edge.plan .elab text{fill:var(--plan)}
.edge.map .elab text{fill:var(--sel)}
.cluster rect.frame{fill:color-mix(in srgb,var(--surface) 55%,transparent);stroke-width:1.4}
.cluster .title{font:700 20px var(--f-diagram);fill:var(--ink)}
.cluster .bsub{font:400 12px var(--f-body);fill:var(--ink-2)}
.ent rect{fill:var(--surface);stroke-width:1.2}
.ent .lab{font:600 13.5px var(--f-diagram);fill:var(--ink)}
.ent .sub{font:400 10px var(--f-mono);fill:var(--ink-3)}
.peek{font:500 13px var(--f-body);fill:var(--ink-3);letter-spacing:.02em}
.ctitle{font-family:var(--f-diagram);font-weight:700;letter-spacing:-.005em}
.csub{font:400 14px var(--f-body);fill:var(--ink-2)}
.collapsible:not(.open) .hdr-open,.collapsible.open .hdr-closed{display:none}
.band{font:600 10px var(--f-body);letter-spacing:.12em;fill:var(--ink-3);text-transform:uppercase}
svg[data-lod="far"] .lod-mid,svg[data-lod="far"] .lod-near,svg[data-lod="mid"] .lod-near{display:none}
svg.focus .node,svg.focus .edge{opacity:.16;transition:opacity .2s}
svg.focus .hl{opacity:1!important}
svg.focus .node.hl rect,svg.focus .node.hl rect.frame{stroke:var(--sel)!important;stroke-width:2.6}
svg.focus .edge.hl path.line{stroke-width:2.8}
.hidden-status{display:none}
@media (prefers-reduced-motion:reduce){svg.focus .node,svg.focus .edge{transition:none}}
@media (max-width:820px){
  main{flex-direction:column}
  .canvas{flex:none;height:58vh}
  aside{width:auto;border-left:0;border-top:1px solid var(--line);flex:1}
  .legend{margin-left:0}
  header h1 small{display:none}
}
</style>

<div class="app">
<header>
  <h1>Neurostore Pipeline Atlas <small>ingestion → curation → meta-analysis</small></h1>
  <div class="tabs" role="tablist" aria-label="Diagram view">
    <button id="v-system" role="tab" aria-selected="true">Components &amp; pipelines</button>
    <button id="v-schema" role="tab" aria-selected="false">Data schemas</button>
  </div>
  <div class="legend" aria-label="Edge status filter">
    <button id="lg-impl" aria-pressed="true" data-status="impl"><svg viewBox="0 0 26 8"><line x1="0" y1="4" x2="26" y2="4" stroke="var(--ink-2)" stroke-width="2"/></svg>Built</button>
    <button id="lg-plan" aria-pressed="true" data-status="plan"><svg viewBox="0 0 26 8"><line x1="0" y1="4" x2="26" y2="4" stroke="var(--plan)" stroke-width="2" stroke-dasharray="6 4"/></svg>Intended, not built</button>
    <button id="lg-spec" aria-pressed="true" data-status="spec"><svg viewBox="0 0 26 8"><line x1="0" y1="4" x2="26" y2="4" stroke="var(--spec)" stroke-width="2" stroke-dasharray="2 3"/></svg>Spec only</button>
    <button id="lg-map" aria-pressed="true" data-status="map"><svg viewBox="0 0 26 8"><line x1="0" y1="4" x2="26" y2="4" stroke="var(--sel)" stroke-width="2" stroke-dasharray="5 3"/></svg>Cross-schema join</button>
  </div>
</header>
<main>
  <div class="canvas" id="canvas">
    <svg id="svg" viewBox="0 0 2000 1360" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Interactive architecture diagram">
      <defs>
        <marker id="ar-impl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--ink-2)"/></marker>
        <marker id="ar-plan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--plan)"/></marker>
        <marker id="ar-spec" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--spec)"/></marker>
        <marker id="ar-map" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--sel)"/></marker>
        <marker id="ar-rel" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--ink-3)"/></marker>
      </defs>
      <g id="g-system"></g>

</main>
</div>

<script>
(() => {
const NS = 'http://www.w3.org/2000/svg';
const $ = s => document.querySelector(s);
const svg = $('#svg');
const H = (s) => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ----------------------------------------------------------------------------
   REPOS (latest default branch, cloned 2026-10-20)
---------------------------------------------------------------------------- */
const REPOS = {
  ing:      {name:'ns-pond-ingestion-workflow', gh:'jdkent/ns-pond-ingestion-workflow', br:'main',   sha:'658a13c', date:'2026-10-20'},
  pondie:   {name:'pondie',                     gh:'neurostuff/pondie',                 br:'main',   sha:'fb9d7da', date:'2026-10-18'},
  store:    {name:'neurostore (store)',         gh:'neurostuff/neurostore',             br:'master', sha:'d1bab34', date:'2026-10-19'},
  compose:  {name:'neurostore (compose)',       gh:'neurostuff/neurostore',             br:'master', sha:'d1bab34', date:'2026-10-19'},
  spec:     {name:'neurostore-spec',            gh:'neurostuff/neurostore-spec',        br:'main',   sha:'8aa1e05', date:'2026-10-18'},
  schema:   {name:'study_schema',               gh:'neurostuff/study_schema',           br:'main',   sha:'7c0425a', date:'2026-10-18'},
  nimads:   {name:'NIMADS',                     gh:'neurostuff/NIMADS',                 br:'main',   sha:'2b6f0d3', date:'2026-02-12'},
  nimare:   {name:'NiMARE',                     gh:'neurostuff/NiMARE',                 br:'main',   sha:'ea8696e', date:'2026-10-08'},
  autonima: {name:'autonima',                   gh:'neurostuff/autonima',               br:'master', sha:'3f50b65', date:'2026-09-30'},
  runner:   {name:'compose-runner',             gh:'neurostuff/compose-runner',         br:'main',   sha:'1cfc337', date:'2026-10-02'},
};

/* ----------------------------------------------------------------------------
   SYSTEM VIEW: component boxes and their internal stages
---------------------------------------------------------------------------- */
const BOX = {
  user:    {x:1110,y:28, w:420,h:74, c:'user', title:'Researchers & curators', sub:'neurosynth-compose web app (React) · Auth0 login', repo:'compose',
            desc:'People who upload or edit studies in neurostore and build meta-analyses in neurosynth-compose. The frontend talks to both APIs through the generated TypeScript SDKs.', refs:['compose/neurosynth-frontend/src/pages/*','store/backend/neurostore/config.py:153 (Auth0 tenant neurosynth.us.auth0.com)']},
  sources: {x:20,  y:150,w:200,h:470, c:'ext', title:'Literature', sub:'External APIs & corpora', desc:'Publisher, index and open-access services that the ingestion workflow and autonima read from.'},
  ing:     {x:260, y:150,w:700,h:470, c:'ing', title:'ns-pond-ingestion-workflow', sub:'`ingest` CLI · 15 stages in STAGE_ORDER · resumable via fingerprints', repo:'ing',
            desc:'Single-process, batch pipeline (batches of 500 articles; thread/process pools inside a stage, no queue). Downloads articles, extracts text and tables, gets bibliographic metadata, parses coordinates with LLMs, classifies coordinate-set roles, and emits study_schema C2/C3 contracts that are synced to the ns-pond tree and uploaded to neurostore.',
            refs:['ingestion_workflow/pipeline/stages/__init__.py (STAGE_ORDER, PROSE_STAGES, OPT_IN_STAGES)','ingestion_workflow/pipeline/scheduler.py (run_stages)','configs/settings_reference.yaml']},
  nspond:  {x:300, y:650,w:330,h:80, c:'ing', title:'ns-pond tree', sub:'file contract on beast · read by pondie', repo:'ing', small:true,
            desc:'Directory layout written by the sync stage (pyarty layout). Per base study: identifiers.json; processed/<source>/{metadata.json, tables.jsonl, analyses.jsonl, coordinates.csv, text.txt}; stage1/analyses.json (with roles); parse/parsed_paper.json (C2) and parse/coordinate_parse.json (C3). Articles without a base study go to <root>-new/, retracted ones to <root>-retracted/.',
            refs:['ingestion_workflow/services/nspond.py','ingestion_workflow/services/nspond_schema.py','ingestion_workflow/services/paper_parse.py']},
  pondie:  {x:260, y:760,w:700,h:260, c:'pondie', title:'pondie', sub:'LLM study-metadata extraction · groups, tasks, modality, models, analyses', repo:'pondie',
            desc:'Extracts a full study record (storage-schema Study with every scalar wrapped in ExtractedValue + evidence quotes) from the full text and the coordinate parse. Default stages: tables → split → single → fill → evidence → build → repair. Model is a required CLI argument (scripts default to gpt-6-luna via a Portkey gateway; codex backend optional).',
            refs:['pondie/extraction/models.py (StageName)','pondie/extraction/stages.py (sequence)','pondie/cli.py','pondie/extraction/llm.py (GatewayCaller, CodexCaller)']},
  contracts:{x:20, y:660,w:200,h:440, c:'contract', title:'Contracts', sub:'click: who writes & reads', desc:'The shapes exchanged between applications. study_schema (LinkML → pydantic + JSON Schema) defines the paper parse and study record; NIMADS (JSON Schema) is the meta-analysis interchange; neurostore-spec is the OpenAPI surface that references NIMADS base schemas.'},
  store:   {x:1060,y:150,w:520,h:560, c:'store', title:'neurostore', sub:'Flask/connexion API · Postgres 17 + pgvector · outbox workers', repo:'store',
            desc:'The study store. Holds bibliographic base studies and their versions, NIMADS-shaped studysets/annotations, pipeline results used as filters, and the study_schema claim layer (StudyEntity / FieldClaim) that records machine and human values field by field.',
            refs:['store/docker-compose.yml','store/backend/neurostore/models/data.py','store/backend/neurostore/ingest/study_schema.py']},
  compose: {x:1060,y:780,w:520,h:320, c:'compose', title:'neurosynth-compose', sub:'project → curation → extraction → spec → run → results', repo:'compose',
            desc:'Meta-analysis builder (lives in the neurostore repo under compose/). Projects keep curation and extraction state in Project.provenance; meta-analyses store a NiMARE specification plus snapshots of the neurostore studyset and annotation; runs are dispatched to compose-runner.',
            refs:['compose/docker-compose.yml','compose/backend/neurosynth_compose/models/analysis.py','compose/neurosynth-frontend/src/hooks/projects/Project.types.ts']},
  nimare:  {x:1680,y:150,w:300,h:570, c:'nimare', title:'NiMARE', sub:'library · 0.22.0 pinned by compose-runner', repo:'nimare',
            desc:'Python library that executes coordinate- and image-based meta-analyses. Studyset (columnar NIMADS) is the canonical input; Dataset is deprecated since 0.21.0.',
            refs:['nimare/studyset/studyset.py','nimare/workflows/base.py','nimare/meta/cbma/','nimare/meta/ibma.py']},
  runner:  {x:1680,y:780,w:300,h:560, c:'runner', title:'compose-runner', sub:'Lambda → Step Functions → Fargate', repo:'runner',
            desc:'Executes one compose meta-analysis: pulls the spec from compose and the live studyset/annotation from neurostore, builds NiMARE objects, runs the workflow and uploads maps and tables back to compose.',
            refs:['compose_runner/run.py (Runner.run_workflow:236)','infra/cdk/stacks/compose_runner_stack.py','compose_runner/aws_lambda/']},
  autonima:{x:260, y:1110,w:1180,h:220, c:'autonima', title:'autonima', sub:'automated meta-analysis from a YAML config · CLI + web UI', repo:'autonima',
            desc:'End-to-end LLM-assisted meta-analysis: search → screen → retrieve full text → screen → parse coordinates → annotate analyses against criteria → NIMADS → NiMARE. Accepts any local full text and pre-extracted coordinates; writes its own NIMADS JSON.',
            refs:['autonima/pipeline.py (AutonimaPipeline.run:395-417)','autonima/models/types.py (PipelineConfig:387)','autonima/meta.py']},
  nv:      {x:1470,y:1140,w:180,h:64, c:'ext', title:'NeuroVault', sub:'statistical map hosting', small:true, desc:'Receives meta-analysis result maps from the compose Celery worker (task neurovault.upload). compose-runner accepts an --nv-key but does not use it.', refs:['compose/backend/neurosynth_compose/resources/tasks.py']},
};

// chip(id, box, x, y, w, h, label, sub, detail)

function el(tag, attrs={}, parent) { const e=document.createElementNS(NS,tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; }
function wrap(text, maxChars) {
  const words = String(text).split(/\s+/); const lines=[]; let cur='';
  for (const w of words) { if ((cur+' '+w).trim().length > maxChars && cur) { lines.push(cur); cur=w; } else cur=(cur+' '+w).trim(); }
  if (cur) lines.push(cur); return lines;
}
function textLines(parent, lines, x, y, lh, cls, anchor='start') {
  const t = el('text',{x,y,class:cls,'text-anchor':anchor},parent);
  lines.forEach((ln,i)=>{ const s=el('tspan',{x,dy: i?lh:0},t); s.textContent=ln; });
  return t;

    const c=CL[d.cl]; const rel=RELS.filter(r=>r.a===d.id||r.b===d.id);
    p.innerHTML=`<div class="meta"><span class="swatch" style="background:${col(c.c)}"></span>${H(c.title)}${d.line?` · data.py:${d.line}`:''}</div><h2>${H(d.name)}</h2>
      <h3>Fields</h3><table class="f">${d.fields.map(([f,x])=>`<tr><td>${H(f)}</td><td>${H(x)}</td></tr>`).join('')}</table>
      <h3>Relations</h3><ul class="rels">${rel.map(r=>{const other=r.a===d.id?r.b:r.a; const dir=r.a===d.id?'→':'←'; return `<li>${dir} <button class="linkbtn" data-go="${other}">${H(NODES[other]?.data.name||other)}</button> <span style="color:var(--ink-3)">${H(r.l||'')}${r.map?' · join':''}</span>${r.d?`<div style="color:var(--ink-2);font-size:12px">${H(r.d)}</div>`:''}</li>`;}).join('')}</ul>
      <div class="meta" style="margin-top:12px">${repoLine(c.repo)}</div>`;
  } else {
    const box = n.kind==='chip'? BOX[d.box] : d; const repo = box.repo;
    const sub = n.kind==='chip' ? CHIPS.filter(c=>c.box===d.box) : CHIPS.filter(c=>c.box===selected);
    const inE = EDGES.filter(e=>!e.internal && (e.b[0]===selected || (n.kind==='box' && CHIPS.find(c=>c.id===e.b[0])?.box===selected)));
    const outE= EDGES.filter(e=>!e.internal && (e.a[0]===selected || (n.kind==='box' && CHIPS.find(c=>c.id===e.a[0])?.box===selected)));
    const eLine = (e,dir)=>{ const o = dir==='in'? e.a[0]:e.b[0]; return `<li><button class="linkbtn" data-go="${e.id}">${H(e.label)}</button> ${dir==='in'?'from':'to'} ${H(nameOf(o))} ${e.st!=='impl'?statusPill(e.st):''}</li>`; };
    p.innerHTML=`<div class="meta"><span class="swatch" style="background:${col(box.c)}"></span>${H(n.kind==='chip'?box.title:'application')} ${d.status&&d.status!=='impl'?statusPill(d.status):''}</div>
      <h2>${H(d.title||d.label)}</h2>${d.sub&&n.kind==='chip'?`<p style="color:var(--ink-2)">${H(d.sub)}</p>`:''}
      ${d.desc?`<p>${H(d.desc)}</p>`:''}${list('Inputs',d.inputs)}${list('Outputs',d.outputs)}${list('Services & models',d.services)}${refs(d.refs)}
      ${inE.length?`<h3>Arrives</h3><ul>${inE.map(e=>eLine(e,'in')).join('')}</ul>`:''}${outE.length?`<h3>Leaves</h3><ul>${outE.map(e=>eLine(e,'out')).join('')}</ul>`:''}
      ${n.kind==='box'&&sub.length?`<h3>Inside (${sub.length})</h3><ul class="rels">${sub.map(c=>`<li><button class="linkbtn" data-go="${c.id}">${H(c.label)}</button> <span style="color:var(--ink-3)">${H(c.sub||'')}</span></li>`).join('')}</ul>`:''}
      ${n.kind==='chip'?`<p style="margin-top:12px"><button class="btn" data-zoom="${d.box}">Zoom to ${H(box.title)}</button></p>`:''}
      ${repo?`<div class="meta" style="margin-top:12px">${repoLine(repo)}</div>`:''}`;
  }
}
function renderFlow(){
  const steps=FLOWS[flowTrack];
  $('#panel').innerHTML=`<h2>How a study moves</h2><p>Two routes end in NiMARE. Pick one and step through it; the diagram lights up what each step touches.</p>
   <div class="track"><button class="btn" id="tr-ns" aria-pressed="${flowTrack==='neurostore'}" style="${flowTrack==='neurostore'?'border-color:var(--sel);color:var(--ink)':''}">neurostore route</button><button class="btn" id="tr-au" aria-pressed="${flowTrack==='autonima'}" style="${flowTrack==='autonima'?'border-color:var(--sel);color:var(--ink)':''}">autonima route</button></div>
   <ol class="steps">${steps.map((s,i)=>`<li><button data-step="${i}" aria-current="${i===flowStep}"><span class="n">${String(i+1).padStart(2,'0')}</span><span><b>${H(s.t)}</b><span class="d">${H(s.d)}</span></span></button></li>`).join('')}</ol>
   <p style="margin-top:10px;display:flex;gap:6px"><button class="btn" id="st-prev">Previous</button><button class="btn" id="st-next">Next step</button><button class="btn" id="st-clear">Clear</button></p>`;
  $('#tr-ns').onclick=()=>{flowTrack='neurostore';flowStep=-1;if(view!=='system')setView('system');clearFocus();renderFlow();};
  $('#tr-au').onclick=()=>{flowTrack='autonima';flowStep=-1;if(view!=='system')setView('system');clearFocus();renderFlow();};
  $('#st-prev').onclick=()=>gotoStep(Math.max(0,flowStep-1));
  $('#st-next').onclick=()=>gotoStep(Math.min(steps.length-1,flowStep+1));
  $('#st-clear').onclick=()=>{flowStep=-1;setOpen([...expanded],false);clearFocus();fitView();renderFlow();};
}
function gotoStep(i){
  if(view!=='system') setView('system');
  flowStep=i; const s=FLOWS[flowTrack][i];
  const need=new Set(); s.ids.forEach(id=>{ const n=NODES[id]; const o = owner(id) || (n&&n.data.internal ? owner(n.data.a[0]) : null); if(o) need.add(o); });
  setOpen([...expanded].filter(x=>!need.has(x)), false); setOpen([...need], true);
  highlight(s.ids);
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  s.ids.forEach(id=>{ const n=NODES[id]; if(!n) return; let b; if(n.kind==='edge'){ const bb=n.path.getBBox(); b={x:bb.x,y:bb.y,w:bb.width,h:bb.height}; } else b=n; x0=Math.min(x0,b.x);y0=Math.min(y0,b.y);x1=Math.max(x1,b.x+b.w);y1=Math.max(y1,b.y+b.h); });
  if(x0<1e9) fitRect(x0,y0,x1-x0,y1-y0,60);
  renderFlow();
}
function renderGaps(){
  $('#panel').innerHTML=`<h2>Where it differs from the plan</h2><p>Each item compares the intended architecture with what the latest default branches actually do.</p>
   ${GAPS.map(([s,t,d])=>`<div class="gap ${s==='plan'?'':s}"><b>${H(t)}</b>${H(d)}</div>`).join('')}`;
}
function renderSrc(){
  $('#panel').innerHTML=`<h2>Grounded in</h2><p>Shallow clones of each repository's default branch, read on 2026-10-20. File references in the Details tab are relative to each repo root.</p>
   <table class="repos">${Object.entries(REPOS).filter(([k])=>k!=='compose').map(([k,r])=>`<tr><td>${H(r.name.replace(' (store)',''))}</td><td class="ref">${H(r.gh)}</td><td class="ref">${H(r.sha)}</td><td>${H(r.date)}</td></tr>`).join('')}</table>
   <h3>Reading the diagram</h3><ul><li>Solid arrows exist in code today.</li><li>Dashed amber arrows are hand-offs you described that are not built yet.</li><li>Dotted grey marks the draft review API, present only in neurostore-spec.</li><li>Blue dashed arrows in the schema view join entities across schemas (shared keys, copied fields, API projections).</li></ul>
   <h3>Not shown</h3><p>neurostore-text-extraction, ns-validate (Label Studio review at validate.neurostore.xyz) and the SDK generator repos sit beside this flow but were not part of this read.</p>`;
}
function showTab(t){ panelTab=t; ['flow','detail','gaps','src'].forEach(k=>$('#p-'+k).setAttribute('aria-selected',k===t)); ({flow:renderFlow,detail:renderDetail,gaps:renderGaps,src:renderSrc})[t](); $('#panel').scrollTop=0; }
['flow','detail','gaps','src'].forEach(k=>$('#p-'+k).onclick=()=>showTab(k));
$('#panel').addEventListener('click',ev=>{
  const s=ev.target.closest('[data-step]'); if(s){ gotoStep(+s.dataset.step); return; }
  const go=ev.target.closest('[data-go]'); if(go){ const id=go.dataset.go; const n=NODES[id]; if(!n) return; selected=id;
    const o = owner(id) || (n.data.internal ? owner(n.data.a[0]) : null); if(o && !expanded.has(o)) setOpen([o], true);
    if(n.kind==='edge'){ highlight([id, ...(Array.isArray(n.data.a)?[n.data.a[0],n.data.b[0]]:[n.data.a,n.data.b])]); const bb=n.path.getBBox(); fitRect(bb.x,bb.y,bb.width,bb.height,80); }
    else { highlight(n.data.isContract?[id,...n.data.users]:connected(id)); fitRect(n.x,n.y,n.w,n.h, n.kind==='box'?30:220); }
    renderDetail(); return; }
  const z=ev.target.closest('[data-zoom]'); if(z){ const n=NODES[z.dataset.zoom]; setOpen([z.dataset.zoom],true); fitRect(n.x,n.y,n.w,n.h,30); }
});

function setView(v){ view=v; $('#g-system').style.display = v==='system'?'':'none'; $('#g-schema').style.display = v==='schema'?'':'none';
  if (v==='system') renderSystemEdges(); else renderSchemaEdges(); applyStatusFilter();
  $('#v-system').setAttribute('aria-selected',v==='system'); $('#v-schema').setAttribute('aria-selected',v==='schema');
  clearFocus(); selected=null; const b=VIEWB[v]; setVB({...b}); requestAnimationFrame(fitView);
  if(panelTab==='detail') renderDetail(); }
$('#v-system').onclick=()=>setView('system');
$('#v-schema').onclick=()=>{ setView('schema'); if(panelTab==='flow') showTab('detail'); };

// status filter
document.querySelectorAll('.legend button').forEach(b=>b.onclick=()=>{ b.setAttribute('aria-pressed', b.getAttribute('aria-pressed')!=='true'); applyStatusFilter(); });

renderSystem();
// schema renders while hidden: getBBox needs layout, so render visible then hide
$('#g-schema').style.display=''; renderSchema(); $('#g-schema').style.display='none';
setVB({...VIEWB.system});
try { const h=location.hash.slice(1); if(h==='schemas') setView('schema'); } catch(e){}
showTab('flow');
requestAnimationFrame(fitView);
})();
</script>

</body></html>
